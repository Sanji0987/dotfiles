# ~/.config/hypr/hyprpaper.conf
#
# edited by claude opus 5
# revived and corrected: the Quickshell shell painted the background via its
# own omarchy-background layer, so this file went stale — it still named DP-1
# (the display moved to DP-2 in 9d8b897) and the old linus.png wallpaper
#
# Started from conf/autostart.lua. The wallpaper is the rainynight theme's
# own, copied to ~/Pictures/Wallpapers/ before the theme tree was deleted;
# hyprlock.conf uses the same file, so the lock screen and the desktop match.

preload = ~/Pictures/Wallpapers/rainynight-1.png

wallpaper {
  monitor = DP-2
  path = ~/Pictures/Wallpapers/rainynight-1.png
  fit_mode = cover
}

# Keep the wallpaper in VRAM rather than reloading it on every workspace
# change; it is 46K, so this costs nothing.
splash = false
ipc = on
