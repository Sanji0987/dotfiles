# ~/.config/hypr/hyprpaper.conf
#
# edited by claude opus 5
# revived and corrected: the Quickshell shell painted the background via its
# own omarchy-background layer, so this file went stale — it still named DP-1
# (the display moved to DP-2 in 9d8b897) and the old linus.png wallpaper
#
# edited by claude opus 5
# switched to aurora-night: the old pixel-art wallpaper was near-black, which
# made the gaps, rounded corners and 1px borders invisible
#
# Started from conf/autostart.lua. aurora-night.png is a generated blue/violet
# gradient (not downloaded — see the note in README), chosen because the whole
# look depends on the wallpaper being visible in the gaps. hyprlock.conf uses
# the same file, so the lock screen and the desktop match.
#
# The rainynight-*.png set is still in ~/Pictures/Wallpapers/ if wanted back.

preload = ~/Pictures/Wallpapers/aurora-night.png

wallpaper {
  monitor = DP-2
  path = ~/Pictures/Wallpapers/aurora-night.png
  fit_mode = cover
}

# Keep the wallpaper in VRAM rather than reloading it on every workspace
# change; it is ~1MB, so this costs little.
splash = false
ipc = on
