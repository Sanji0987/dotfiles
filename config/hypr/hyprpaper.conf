# ~/.config/hypr/hyprpaper.conf
#
# edited by claude opus 5
# revived and corrected: the Quickshell shell painted the background via its
# own omarchy-background layer, so this file went stale — it still named DP-1
# (the display moved to DP-2 in 9d8b897) and the old linus.png wallpaper
#
# edited by claude opus 5
# nordic-mountain: dark blue-grey peaks, which suit the rainynight palette
# better than the macOS blue/violet flow did
#
# Pre-cropped to 1920x1080 from ~/Pictures/mountain.png (4717x2984, aspect
# 1.58 — narrower than 16:9, so `cover` was trimming sky and foreground on
# every load). Cropping once to a 150K jpeg instead of holding 4.9MB in VRAM
# and re-cropping is the same reasoning the gnome branch's README gives for
# preferring 2k sources over 4k. The original is kept beside it as
# nordic-mountain-original.png.
#
# Started from conf/autostart.lua. The old rainynight pixel-art wallpaper was
# near-black, which made the gaps, rounded corners and 1px borders invisible;
# the whole look depends on the wallpaper being visible between windows.
# hyprlock.conf uses the same file, so lock screen and desktop match.
#
# 3000x1688 is exactly 16:9, so it maps to this 1920x1080 display with no
# cropping. fit_mode = cover would crop on a non-16:9 monitor.
#
# Also in ~/Pictures/Wallpapers/: aurora-night.png (the generated stand-in)
# and the rainynight-*.png set.

preload = ~/Pictures/Wallpapers/nordic-mountain.jpg

wallpaper {
  monitor = DP-2
  path = ~/Pictures/Wallpapers/nordic-mountain.jpg
  fit_mode = cover
}

# Keep the wallpaper in VRAM rather than reloading it on every workspace
# change; it is 150K, so this costs nothing.
splash = false
ipc = on
