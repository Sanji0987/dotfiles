#  ~/.config/hypr/hyprlock.conf
#
#  edited by claude opus 5
#  rebuilt as the big-clock layout from the rainynight theme's screenshots
#
#  Colours are NOT written here. They are sourced from the active Omarchy
#  theme, so switching theme recolours the lock screen with no edit. The theme
#  supplies $color, $inner_color, $outer_color, $font_color, $placeholder_color
#  and $check_color; this file only lays them out.
#
#  The previous version of this file hardcoded the linus.png palette over
#  ~/Pictures/linus.png. It is in ~/dotfiles_backup/2026-09-13/ if wanted back.
#
#  Bound to SUPER + SHIFT + L in conf/keybinds.lua.

source = $HOME/.local/state/omarchy/current/theme/hyprlock.conf

$font      = JetBrainsMono Nerd Font
$font_bold = JetBrainsMono NF ExtraBold

general {
    hide_cursor        = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier    = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, linear
    animation = fadeOut, 1, 4, linear
    animation = inputFieldDots, 1, 2, linear
}

# The theme's own wallpaper, via the symlink Omarchy repoints on every theme
# change -- so this follows the theme too. Heavily blurred and darkened, which
# is what lets a white clock sit on a busy pixel-art background.
background {
    monitor     =
    path        = $HOME/.local/state/omarchy/current/background
    blur_passes = 3
    blur_size   = 6
    brightness  = 0.55
    contrast    = 1.0
    vibrancy    = 0.15
}

# ── clock: hour over minute, very large ──────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:1000] date +"%H"
    color       = $font_color
    font_size   = 190
    font_family = $font_bold

    position = 0, 300
    halign   = center
    valign   = center
}

label {
    monitor     =
    text        = cmd[update:1000] date +"%M"
    color       = $font_color
    font_size   = 190
    font_family = $font_bold

    position = 0, 110
    halign   = center
    valign   = center
}

# Thin rule between the clock and the date.
shape {
    monitor  =
    size     = 230, 2
    color    = $placeholder_color
    rounding = 0

    position = 0, 5
    halign   = center
    valign   = center
}

# ── date ─────────────────────────────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:60000] date +"%A"
    color       = $font_color
    font_size   = 22
    font_family = $font_bold

    position = 0, -25
    halign   = center
    valign   = center
}

label {
    monitor     =
    text        = cmd[update:60000] date +"%d %b"
    color       = $font_color
    font_size   = 16
    font_family = $font

    position = 0, -60
    halign   = center
    valign   = center
}

# ── now playing ──────────────────────────────────────────────────────────────
# playerctl is installed. Title only, not "title - artist": playerctl's --format
# uses {{ }}, and hyprlang reads {{ }} as an arithmetic expression, so the
# obvious version fails to parse. When nothing is playing playerctl exits
# non-zero with no output, which leaves the label empty, which is what we want.
label {
    monitor     =
    text        = cmd[update:2000] playerctl metadata title 2>/dev/null | cut -c1-60
    color       = $placeholder_color
    font_size   = 15
    font_family = $font

    position = 0, -155
    halign   = center
    valign   = center
}

# ── input ────────────────────────────────────────────────────────────────────
label {
    monitor     =
    text        = 
    color       = $placeholder_color
    font_size   = 16
    font_family = $font

    position = 0, -265
    halign   = center
    valign   = center
}

input-field {
    monitor = 
    size    = 240, 46

    outline_thickness = 1
    rounding          = -1

    inner_color = $inner_color
    outer_color = $outer_color
    check_color = $check_color
    font_color  = $font_color

    placeholder_text = 
    fail_text        = <span foreground="##ff6b6b">$FAIL</span>

    fade_on_empty = false
    dots_size     = 0.25
    dots_spacing  = 0.35
    dots_center   = true

    position = 0, -335
    halign   = center
    valign   = center
}

# The theme's screenshot has a decorative quote here. This shows who the
# session belongs to instead, which is at least useful at a lock screen.
label {
    monitor     =
    text        = <i>$USER</i>
    color       = $placeholder_color
    font_size   = 13
    font_family = $font

    position = 0, -390
    halign   = center
    valign   = center
}
