#  ~/.config/hypr/hyprlock.conf
#
#  edited by claude opus 5
#  rebuilt as the big-clock layout from the rainynight theme's screenshots
#
#  edited by claude opus 5
#  colours inlined and the wallpaper repointed: the omarchy theme state this
#  used to source is being deleted, so this file owns its own look now
#
#  edited by claude opus 5
#  repalletted to the neutral glass scheme and moved onto Inter, so the lock
#  screen matches the bar and launcher rather than the retired indigo look
#
#  Colours are literals, the same neutral set as conf/palette.lua,
#  config/waybar/style.css, config/rofi/spotlight.rasi and config/mako/config.
#  Edit them together; nothing keeps them in step.
#
#  The previous rainynight values are in git, and the look they belonged to is
#  still switchable — see the tail of conf/theme.lua.
#
#  Bound to SUPER + SHIFT + L in conf/keybinds.lua.

$color             = rgba(0, 0, 0, 1)
$inner_color       = rgba(0, 0, 0, 0.45)
$outer_color       = rgba(112, 112, 112, 0.65)
$font_color        = rgba(255, 255, 255, 1)
$placeholder_color = rgba(222, 222, 222, 0.6)
$check_color       = rgba(8, 96, 242, 1)

#  edited by claude opus 5
#  Inter for the clock and date: the desktop's typeface everywhere else, and
#  the big numerals are what the lock screen is. The Nerd Font stays available
#  for the glyph in the input prompt.
$font      = Inter
$font_bold = Inter ExtraBold
#  Glyph labels (the lock icon, the input placeholder) stay on the Nerd Font:
#  Inter has none of those codepoints and would render tofu.
$font_icon = JetBrainsMono Nerd Font

general {
    hide_cursor        = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier    = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, linear
    animation = fadeOut, 1, 4, linear
    animation = inputFieldDots, 1, 2, linear
}

# edited by claude opus 5
# points at a real file in ~/Pictures/Wallpapers now, not the symlink omarchy
# used to repoint on every theme change
#
# The theme's own wallpaper, copied out of the theme tree before it was
# deleted. Heavily blurred and darkened, which is what lets a white clock sit
# on a busy pixel-art background.
background {
    monitor     =
    path        = $HOME/Pictures/Wallpapers/macos-blue-flow.jpg
    blur_passes = 3
    blur_size   = 6
    brightness  = 0.55
    contrast    = 1.0
    vibrancy    = 0.15
}

# ── clock: hour over minute, very large ──────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:1000] date +"%H"
    color       = $font_color
    font_size   = 190
    font_family = $font_bold

    position = 0, 300
    halign   = center
    valign   = center
}

label {
    monitor     =
    text        = cmd[update:1000] date +"%M"
    color       = $font_color
    font_size   = 190
    font_family = $font_bold

    position = 0, 110
    halign   = center
    valign   = center
}

# Thin rule between the clock and the date.
shape {
    monitor  =
    size     = 230, 2
    color    = $placeholder_color
    rounding = 0

    position = 0, 5
    halign   = center
    valign   = center
}

# ── date ─────────────────────────────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:60000] date +"%A"
    color       = $font_color
    font_size   = 22
    font_family = $font_bold

    position = 0, -25
    halign   = center
    valign   = center
}

label {
    monitor     =
    text        = cmd[update:60000] date +"%d %b"
    color       = $font_color
    font_size   = 16
    font_family = $font

    position = 0, -60
    halign   = center
    valign   = center
}

# ── now playing ──────────────────────────────────────────────────────────────
# playerctl is installed. Title only, not "title - artist": playerctl's --format
# uses {{ }}, and hyprlang reads {{ }} as an arithmetic expression, so the
# obvious version fails to parse. When nothing is playing playerctl exits
# non-zero with no output, which leaves the label empty, which is what we want.
label {
    monitor     =
    text        = cmd[update:2000] playerctl metadata title 2>/dev/null | cut -c1-60
    color       = $placeholder_color
    font_size   = 15
    font_family = $font

    position = 0, -155
    halign   = center
    valign   = center
}

# ── input ────────────────────────────────────────────────────────────────────
# edited by claude opus 5
# this label is a Nerd Font glyph, so it must not follow $font to Inter
label {
    monitor     =
    text        =
    color       = $placeholder_color
    font_size   = 16
    font_family = $font_icon

    position = 0, -265
    halign   = center
    valign   = center
}

input-field {
    monitor = 
    size    = 240, 46

    outline_thickness = 1
    rounding          = -1

    inner_color = $inner_color
    outer_color = $outer_color
    check_color = $check_color
    font_color  = $font_color

    placeholder_text = 
    fail_text        = <span foreground="##ff6b6b">$FAIL</span>

    fade_on_empty = false
    dots_size     = 0.25
    dots_spacing  = 0.35
    dots_center   = true

    position = 0, -335
    halign   = center
    valign   = center
}

# The theme's screenshot has a decorative quote here. This shows who the
# session belongs to instead, which is at least useful at a lock screen.
label {
    monitor     =
    text        = <i>$USER</i>
    color       = $placeholder_color
    font_size   = 13
    font_family = $font

    position = 0, -390
    halign   = center
    valign   = center
}
