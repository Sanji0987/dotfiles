#  ~/.config/hypr/hyprlock.conf
#  theme: linus.png (dusk river) — near-black, slate blue, sand
#  bound to SUPER + SHIFT + L in hyprland.lua

$font = JetBrainsMono Nerd Font

# --- linus.png palette ---
$black  = rgb(060709)
$slate  = rgb(2c3748)
$steel  = rgb(6b7587)
$pale   = rgb(999fa1)
$sand   = rgb(d4cba6)
$cream  = rgb(e7e6cf)

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, linear
    animation = fadeOut, 1, 4, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = $HOME/Pictures/linus.png
    blur_passes = 2
    blur_size = 5
    brightness = 0.75
    contrast = 1.0
    vibrancy = 0.15
}

input-field {
    monitor =
    size = 260, 44
    outline_thickness = 1
    rounding = 0

    inner_color = rgba(0607099a)
    outer_color = rgba(2c3748ff)
    check_color = rgba(6b7587ff)
    fail_color  = rgba(a4696aff)

    font_color = $cream
    font_family = $font
    placeholder_text = <span foreground="##6b7587"></span>
    fail_text = <span foreground="##a4696a">$FAIL</span>

    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true

    position = 0, -220
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    color = $cream
    font_size = 96
    font_family = $font

    position = 0, 40
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $pale
    font_size = 16
    font_family = $font

    position = 0, -50
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =   $USER
    color = $sand
    font_size = 13
    font_family = $font

    position = 0, -160
    halign = center
    valign = center
}
