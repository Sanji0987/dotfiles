general {
    lock_cmd = pidof hyprlock || hyprlock
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Lock after 15 minutes idle. Deliberately the ONLY listener:
# no DPMS off, no backlight dimming, no suspend. Desktop, not a laptop.
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}
