<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Process-scoped fontconfig for omarchy-shell only.
  Loaded via FONTCONFIG_FILE in omarchy-shell-run so that pointing the
  shell's "monospace" alias at a Nerd Font does NOT change the system-wide
  monospace used by the rest of the desktop.

  /etc/fonts/fonts.conf already pulls in ~/.config/fontconfig/fonts.conf
  via conf.d/50-user.conf, so the user's own rules still apply below.
  Same prepend_first rule that `omarchy font set` writes.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>
</fontconfig>
