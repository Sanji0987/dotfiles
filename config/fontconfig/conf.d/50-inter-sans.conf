<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Default sans-serif is Inter (browsers, Electron, anything asking for "sans-serif").
     Monospace is left alone. Kept out of fonts.conf because KDE rewrites that file. -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>
</fontconfig>
