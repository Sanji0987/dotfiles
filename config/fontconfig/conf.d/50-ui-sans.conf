<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
     edited by claude opus 5
     SF Pro Text is preferred over Inter, with Inter as the fallback.

     Anything asking for "sans-serif" (browsers, Electron, GTK apps that do not
     name a family) gets SF Pro Text if it is installed and Inter if it is not.
     Listing both keeps this file correct on a machine without SF Pro, which
     matters because SF Pro cannot be committed: it is Apple's font, licensed
     for designing interfaces for Apple platforms, not for redistribution.
     Install it to ~/.local/share/fonts/SF/ from developer.apple.com/fonts.

     Note for editors: XML comments may not contain a double hyphen. An earlier
     version of this file used one as punctuation and fontconfig rejected the
     whole file, silently dropping sans-serif back to Noto Sans.

     Monospace is left alone. Kept out of fonts.conf because KDE rewrites that
     file whenever its font settings are touched.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>Inter</family>
    </prefer>
  </alias>
</fontconfig>
