##### General comfort #####
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"       # true color
set -g mouse on                                  # click panes/tabs, drag to resize, scroll
set -g history-limit 50000
set -g base-index 1                              # tabs start at 1 (matches Alt+1..9)
setw -g pane-base-index 1
set -g renumber-windows on                       # no gaps when a tab closes
set -g escape-time 10                            # snappier Esc key
set -g focus-events on
set -g set-clipboard on
setw -g mode-keys vi                             # vi keys when scrolling/copying

# Let Ctrl+Shift combos through (needs a terminal with extended-keys support)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

##### Tabs (windows) #####
# Alt+1..9 -> jump straight to tab N
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# New tab: Ctrl+Shift+T (fallback: Alt+t)
bind -n C-T new-window -c "#{pane_current_path}"
bind -n M-t new-window -c "#{pane_current_path}"

# Close tab: Ctrl+Shift+W (fallback: Alt+w) — asks for confirmation
bind -n C-W confirm-before -p "close tab #W? (y/n)" kill-window
bind -n M-w confirm-before -p "close tab #W? (y/n)" kill-window

# Cycle tabs: Alt+Tab-style with Alt+[ and Alt+]
bind -n M-] next-window
bind -n M-[ previous-window

##### Splits (multiple terminals in one tab) #####
# Ctrl+Shift+D -> split downward (pane below)   fallback: Alt+d
# Ctrl+Shift+H -> split sideways (pane right)   fallback: Alt+h
bind -n C-D split-window -v -c "#{pane_current_path}"
bind -n M-d split-window -v -c "#{pane_current_path}"
bind -n C-H split-window -h -c "#{pane_current_path}"
bind -n M-h split-window -h -c "#{pane_current_path}"

# Move between panes with Alt+arrows (no prefix needed)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Resize panes with Alt+Shift+arrows
bind -n M-S-Left  resize-pane -L 3
bind -n M-S-Right resize-pane -R 3
bind -n M-S-Up    resize-pane -U 2
bind -n M-S-Down  resize-pane -D 2

# Close a pane: Alt+x (with confirmation)
bind -n M-x confirm-before -p "close this pane? (y/n)" kill-pane

##### Sessions / detaching #####
# Detach = leave tmux running in the background; reattach later with: tmux a
# Ctrl+Shift+Q or Alt+q -> detach
bind -n C-Q detach-client
bind -n M-q detach-client
# The classic way still works too: Ctrl+b then d

# Session picker: Alt+s (choose/switch sessions visually)
bind -n M-s choose-tree -Zs

# Rename tab: Alt+r
bind -n M-r command-prompt -I "#W" "rename-window '%%'"

##### Prefix extras (Ctrl+b is the prefix) #####
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

##### Status bar #####
set -g status on
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#a6adc8]%H:%M  %d %b "
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#f9e2af,bold] #I:#W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
