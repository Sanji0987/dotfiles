# vim:ft=kitty
#
# edited by claude opus 5
# holds the glass palette now, and the old "GENERATED -- do not edit" header was
# a lie: omarchy-kitty-theme-sync is gone, so this is a hand-maintained tracked
# file and the two-block structure it used to have (generated catppuccin palette
# + appended rainynight override) is flattened to one explicit set of literals
#
# ACTIVE PALETTE. kitty.conf does `include current-theme.conf`, so whatever is
# here is what the terminal wears. Nothing regenerates it.
#
# To switch schemes, copy one of these over this file:
#   themes/glass.conf       neutral, matches the current desktop
#   themes/rainynight.conf  the previous grey-blue city-night palette
#
# This file is currently a copy of themes/glass.conf. Keep the two in step if
# you edit the palette here.

background            #101010
foreground            #dedede
cursor                #dedede
cursor_text_color     #101010
selection_background  #2a2a2a
selection_foreground  #ffffff

# Normal colors -- HSL saturation 33%, lightness 62%.
# The desktop has no chroma, but a terminal cannot follow it all the way: `ls`,
# diffs and syntax highlighting encode meaning in hue alone, so a grey-only ANSI
# set would be unreadable. Six hues kept, all at one saturation and one
# lightness, landing on the same 126/190 channel pair so none outshouts another.
color0   #1a1a1a
color1   #be7e83
color2   #7ebe89
color3   #beae7e
color4   #7e99be
color5   #be7ebe
color6   #7eb9be
color7   #c8c8c8

# Bright colors -- HSL saturation 38%, lightness 72%.
# Same six hues, one step up. color8 is the desktop's muted grey, which holds
# dimmed output at ~4.6:1 against the background instead of letting it vanish.
color8   #7e7e7e
color9   #d39ca1
color10  #9cd3a6
color11  #d3c59c
color12  #9cb3d3
color13  #d39cd3
color14  #9cced3
color15  #ffffff

# Borders and tabs -- the desktop's two greys, unfocused and focused.
# The desktop red #e05561 appears once, on the bell, because that is the one
# thing in a terminal that is genuinely urgent. It is kept out of the ANSI ramp
# on purpose so the ramp stays evenly saturated.
active_border_color     #707070
inactive_border_color   #393939
bell_border_color       #e05561
active_tab_background   #2a2a2a
active_tab_foreground   #ffffff
inactive_tab_background #161616
inactive_tab_foreground #7e7e7e

# Not a colour. Carried over from rainynight so both theme files and this one
# share a key set and switching cannot leave a stale key behind.
cursor_trail 1
