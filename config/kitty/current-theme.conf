# ---- config/kitty/themes/rainynight.conf ----
# Reviewed extract of the rainynight theme's own kitty.conf
# (atif-1402/omarchy-rainynight-theme).
#
# Why it is copied here instead of used in place: Omarchy refuses a cloned
# theme's kitty.conf (omarchy-theme-set:30) because a kitty config can name the
# program the terminal launches, which is code execution from a cloned repo.
# That refusal is right. So the file was read, the colour and cursor keys taken,
# and nothing else -- no shell, no launch, no map, no env.
#
# This is the terminal palette in the theme's screenshots: a grey-blue city
# night, quite different from the catppuccin-ish colors.toml that drives
# everything else in the theme. Appended after the generated palette by
# omarchy-kitty-theme-sync, so these keys win.

background            #1e2030
foreground            #cdd3e1
cursor                #d6e7ff
selection_background  #292b3b
selection_foreground  #e8f1ff

# Normal colors
color0   #14151f
color1   #bfc6d4
color2   #6e8fb2
color3   #8c92a3
color4   #a8b7d1
color5   #7687a0
color6   #bfc6d4
color7   #d6e7ff

# Bright colors
color8   #8c92a3
color9   #4a79a8
color10  #6e8fb2
color11  #8c92a3
color12  #a8b7d1
color13  #7687a0
color14  #bfc6d4
color15  #ffffff

# Borders
active_border_color     #d6e7ff
inactive_border_color   #292b3b
bell_border_color       #4a79a8

# Part of the theme's feel, not its palette: a short trail behind the cursor.
cursor_trail 1
