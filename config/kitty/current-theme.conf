# Reviewed extract of the rainynight theme's own kitty.conf
# (atif-1402/omarchy-rainynight-theme).
#
# Why it is copied here instead of used in place: Omarchy refuses a cloned
# theme's kitty.conf (omarchy-theme-set:30) because a kitty config can name the
# program the terminal launches, which is code execution from a cloned repo.
# That refusal is right. So the file was read, the colour and cursor keys taken,
# and nothing else -- no shell, no launch, no map, no env.
#
# This is the terminal palette in the theme's screenshots: a grey-blue city
# night, quite different from the catppuccin-ish colors.toml that drives
# everything else in the theme. Appended after the generated palette by
# omarchy-kitty-theme-sync, so these keys win.

background            #1e2030
foreground            #cdd3e1
cursor                #d6e7ff
selection_background  #292b3b
selection_foreground  #e8f1ff

# Normal colors
color0   #14151f
color1   #bfc6d4
color2   #6e8fb2
color3   #8c92a3
color4   #a8b7d1
color5   #7687a0
color6   #bfc6d4
color7   #d6e7ff

# Bright colors
color8   #8c92a3
color9   #4a79a8
color10  #6e8fb2
color11  #8c92a3
color12  #a8b7d1
color13  #7687a0
color14  #bfc6d4
color15  #ffffff

# Borders
active_border_color     #d6e7ff
inactive_border_color   #292b3b
bell_border_color       #4a79a8

# Part of the theme's feel, not its palette: a short trail behind the cursor.
cursor_trail 1

# edited by claude opus 5
# these two keys were only ever set in current-theme.conf's generated catppuccin
# header, never in this extract, so switching back to rainynight would have lost
# them; pinned here as the values that were actually live, catppuccin origin and
# all, so restoring this file reproduces the desktop exactly as it stood rather
# than a tidied-up version of it
#
# they are the one place catppuccin still shows through: the extract overrides
# background to #1e2030 but never touched these two, so the tab bar has been
# wearing catppuccin blue. Left as-is on purpose -- fixing it here would be a
# change, not a preservation. #1e2030 / #a8b7d1 are the rainynight-consistent
# values if you ever want them.
cursor_text_color       #1e1e2e
active_tab_background   #89b4fa

# edited by claude opus 5
# the other three tab keys were missing here too, same inverted tab bar
#
# This is a bug fix, not a palette change, so it does not contradict the note
# above. #89b4fa was a *chosen* colour and is untouched; the inactive tabs were
# never chosen at all -- they were kitty's built-in #999999 fallback, which
# only appears when a theme sets active_tab_background alone. The values below
# are the rainynight-consistent ones the note already recommends.
active_tab_foreground   #1e1e2e
inactive_tab_background #1e2030
inactive_tab_foreground #a8b7d1
