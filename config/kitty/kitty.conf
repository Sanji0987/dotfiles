font_family JetBrainsMono Nerd Font
# font_family CaskaydiaCove Nerd Font
font_size 12
italic_font auto
bold_italic_font auto
shell zsh

# --- look (matches the linus.png theme + Hyprland blur) ---
background_opacity 0.9
background_blur 1
# 1px hairline padding clipped text against the new rounding = 14 corners
# 8, not 1: this used to be a hairline to match Hyprland's border_size = 1.
# Windows are now rounded (14) with a 2px border, and at 1px the text ran into
# the corner arcs. The old note still stands as a warning: full-screen TUIs
# (nvim/NvChad) paint their own background across the cells while padding keeps
# kitty's, so at 8 the nvim background can read as a box. Drop back to 1 if that
# bothers you more than the clipped corners did.
window_padding_width 8
# Briefly flipped to `no` to get WhiteSur-Dark's Big Sur titlebar and traffic
# lights; set back to `yes` on request -- borderless is the preference, and the
# rest of the macOS theming is in the palette, not the chrome.
# The trade-off, if it is ever wanted back: on GNOME/Wayland `yes` means no
# titlebar AND no compositor rounding, so the window is a hard rectangle.
hide_window_decorations yes
window_border_width 0
tab_bar_style powerline
# was `slanted`. macOS tabs (Terminal, Safari, Finder) are rounded rectangles;
# the slant is a Powerline/vim convention, not an Apple one.
tab_powerline_style round
active_tab_font_style   bold
inactive_tab_font_style normal
cursor_shape beam
cursor_blink_interval 0
# macOS sets terminal type looser than kitty's default cell. 110% is the
# smallest step that reads as Apple spacing rather than as double-spacing;
# drop this line to go back to the tight default.
modify_font cell_height 110%

open_url_with default
url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
detect_urls yes
# macOS underlines links straight, not curly
url_style straight
copy_on_select yes
confirm_os_window_close 0
tab_bar_edge top
enabled_layouts splits,stack
# cursor_trail 3

# --- Tabs ---
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

map ctrl+alt+t           launch --cwd=current --type=tab
map ctrl+alt+w           close_tab
map ctrl+alt+right       next_tab
map ctrl+alt+left        previous_tab
map ctrl+alt+shift+right move_tab_forward
map ctrl+alt+shift+left  move_tab_backward
map ctrl+alt+comma       set_tab_title

# --- Splits ---
map ctrl+alt+d           launch --location=vsplit --cwd=current
map ctrl+alt+shift+d     launch --location=hsplit --cwd=current
map ctrl+alt+q           close_window

# move focus between splits (vim keys)
map ctrl+alt+h           neighboring_window left
map ctrl+alt+j           neighboring_window down
map ctrl+alt+k           neighboring_window up
map ctrl+alt+l           neighboring_window right

# resize current split (enters interactive resize mode)
map ctrl+alt+r           start_resizing_window

# zoom/unzoom current split to fill the tab
map ctrl+alt+z           toggle_layout stack

# current-theme.conf is hand-maintained and tracked now — the generator that
# used to write it on every theme change has been removed
# --- Colour theme ---
# current-theme.conf holds the macOS palette -- Apple system colours, matching
# the WhiteSur-Dark GTK/shell theme. It was generated by omarchy-kitty-theme-sync
# until that pipeline was retired; it is a normal tracked file now, so edit it
# directly.
#
# Both palettes are kept whole in themes/ and share one key set, so switching is
# a copy and nothing is left behind:
#   cp themes/macos.conf      current-theme.conf   # Apple system colours (current)
#   cp themes/glass.conf      current-theme.conf   # neutral monochrome
#   cp themes/rainynight.conf current-theme.conf   # grey-blue city night
#
# The standalone palettes next to this file (dracula.conf, kanagawa.conf, ...)
# are kept as a manual escape hatch: include one *after* the line below to
# override the desktop theme for the terminal only.
include current-theme.conf
#
#
