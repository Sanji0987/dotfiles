font_family JetBrainsMono Nerd Font
# font_family CaskaydiaCove Nerd Font
font_size 11
italic_font auto
bold_italic_font auto
shell zsh

# --- look (matches the linus.png theme + Hyprland blur) ---
background_opacity 0.75
background_blur 1
# 1, not 8: full-screen TUIs (nvim/NvChad) paint their own background across the
# cells, but padding keeps kitty's — at 8 that read as a box around nvim. 1px is
# a hairline, matching Hyprland's border_size = 1.
window_padding_width 1
hide_window_decorations yes
window_border_width 0
tab_bar_style powerline
tab_powerline_style slanted
cursor_shape beam
cursor_blink_interval 0

open_url_with default
url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
detect_urls yes
copy_on_select yes
confirm_os_window_close 0
tab_bar_edge top
enabled_layouts splits,stack
# cursor_trail 3

# --- Tabs ---
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

map ctrl+alt+t           launch --cwd=current --type=tab
map ctrl+alt+w           close_tab
map ctrl+alt+right       next_tab
map ctrl+alt+left        previous_tab
map ctrl+alt+shift+right move_tab_forward
map ctrl+alt+shift+left  move_tab_backward
map ctrl+alt+comma       set_tab_title

# --- Splits ---
map ctrl+alt+d           launch --location=vsplit --cwd=current
map ctrl+alt+shift+d     launch --location=hsplit --cwd=current
map ctrl+alt+q           close_window

# move focus between splits (vim keys)
map ctrl+alt+h           neighboring_window left
map ctrl+alt+j           neighboring_window down
map ctrl+alt+k           neighboring_window up
map ctrl+alt+l           neighboring_window right

# resize current split (enters interactive resize mode)
map ctrl+alt+r           start_resizing_window

# zoom/unzoom current split to fill the tab
map ctrl+alt+z           toggle_layout stack

