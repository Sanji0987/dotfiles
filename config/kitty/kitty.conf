# default-valued setting removed by Claude Code Opus
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 10

map ctrl+alt+right next_tab
map ctrl+alt+left  previous_tab

map ctrl+alt+t new_tab
map ctrl+alt+w close_tab

map ctrl+alt+shift+right move_tab_forward
map ctrl+alt+shift+left  move_tab_backward

map ctrl+alt+r set_tab_title

tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title}"

font_family JetBrains Mono
font_size   11.0

include current-theme.conf
