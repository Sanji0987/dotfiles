# vim:ft=kitty
#
# glass -- the neutral terminal palette for the monochrome desktop.
#
# Nothing generates this file. Every value below is a literal; there is no
# theme pipeline behind it any more. Edit it directly.
#
# The desktop it matches is deliberately colourless: near-black surfaces
# carried by alpha rather than by hue, two greys apart for focus, and the
# wallpaper left to supply the only real colour. The chrome keys here follow
# that exactly. The sixteen ANSI slots do not, and cannot -- a grey-only ANSI
# set makes `ls`, diffs and syntax highlighting unreadable, because those
# programs encode meaning in hue and nothing else. So the six hues are kept,
# every one of them at the same low saturation and the same two lightness
# steps, which is enough to tell red from green without putting colour back
# into the desktop.
#
# To switch back: copy themes/rainynight.conf over current-theme.conf.

background            #101010
foreground            #dedede
cursor                #dedede
cursor_text_color     #101010
selection_background  #2a2a2a
selection_foreground  #ffffff

# Normal colors -- HSL saturation 33%, lightness 62%.
# Every hue lands on the same 126/190 channel pair, so no one of them shouts
# louder than the others.
color0   #1a1a1a
color1   #be7e83
color2   #7ebe89
color3   #beae7e
color4   #7e99be
color5   #be7ebe
color6   #7eb9be
color7   #c8c8c8

# Bright colors -- HSL saturation 38%, lightness 72%.
# Same six hues, one step up. color8 is the desktop's muted grey, which keeps
# dimmed output at ~4.6:1 against the background rather than disappearing.
color8   #7e7e7e
color9   #d39ca1
color10  #9cd3a6
color11  #d3c59c
color12  #9cb3d3
color13  #d39cd3
color14  #9cced3
color15  #ffffff

# Borders and tabs -- the desktop's two greys, unfocused and focused.
# The desktop red #e05561 appears once, on the bell, because that is the one
# thing in a terminal that is genuinely urgent. It is deliberately kept out of
# the ANSI ramp above so the ramp stays evenly saturated.
active_border_color     #707070
inactive_border_color   #393939
bell_border_color       #e05561
active_tab_background   #2a2a2a

# Not a colour. Carried over from rainynight so the key set of the two theme
# files matches and switching between them cannot leave a key behind.
cursor_trail 1
