# vim:ft=kitty
#
# macOS palette, to sit alongside the WhiteSur-Dark desktop theme.
#
# Every colour here is an Apple system colour, taken from the HIG rather than
# invented, so the terminal and the GTK theme are quoting the same source:
#   normal (color0-7)  = the LIGHT-mode system colours -- Apple's dimmer set
#   bright (color8-15) = the DARK-mode system colours  -- the same hues, lifted
# That is the one mapping that gives a real normal/bright split without picking
# two unrelated palettes, and it is why the bright row is not just "normal +
# brightness": Apple retunes each hue for dark surfaces, and so does this.
#
# Deliberately NOT the literal Terminal.app ANSI set. That palette's blue is
# #492ee1, which sits at roughly 1.6:1 against a dark background -- authentic
# and unreadable. Apple stopped shipping those values in its own UI for the
# same reason.
#
# Same 28 keys as glass.conf and rainynight.conf, in the same order, so
# switching is a plain copy and nothing stale can survive it.

# Big Sur dark window surface, and Apple's dark-mode label colour.
background            #1e1e1e
foreground            #e8e8ed

# White, not systemBlue. This was #0a84ff on the reasoning that an accent-blue
# beam reads as macOS -- but Terminal.app's own cursor is white, so white is
# both the more faithful choice and the higher-contrast one against #1e1e1e.
# systemBlue is still in the palette as color4/color12.
# cursor_text_color stays at the background colour: that is what shows through
# the cursor if the shape is ever switched from beam to block.
cursor                #ffffff
cursor_text_color     #1e1e1e

# Terminal.app's selection is neutral grey, not accent-tinted, and that is the
# right call here too: a blue wash would sit on top of the syntax colours below
# and mute exactly the hues they encode meaning with.
selection_background  #3a3a3c
selection_foreground  #ffffff

# Normal colors -- Apple system colours, light-mode variants.
# color0 is systemGray6 rather than #000000 so "black" text stays separable
# from the background instead of disappearing into it.
color0   #1c1c1e
color1   #ff3b30
color2   #34c759
color3   #ffcc00
color4   #007aff
color5   #af52de
color6   #30b0c7
color7   #d1d1d6

# Bright colors -- the same hues as Apple retunes them for dark mode.
# color8 is systemGray, which holds dimmed output at ~4.8:1 against the
# background instead of letting it vanish.
color8   #8e8e93
color9   #ff453a
color10  #32d74b
color11  #ffd60a
color12  #0a84ff
color13  #bf5af2
color14  #40c8e0
color15  #ffffff

# Borders and tabs -- macOS window chrome greys.
# The bell is the one traffic-light colour in the file (#ff5f57, the close
# button), kept out of the ANSI ramp on purpose so the ramp stays even. Same
# reasoning as the desktop red in glass.conf, different red.
active_border_color     #48484a
inactive_border_color   #2c2c2e
bell_border_color       #ff5f57
# Active tab is the LIGHTER one -- macOS raises the selected tab toward the
# content area and recesses the rest. All three keys must be set together:
# with only active_tab_background defined, kitty falls back to its built-in
# inactive default (#999, light grey) and the relationship inverts.
active_tab_background   #48484a
active_tab_foreground   #ffffff
inactive_tab_background #2c2c2e
inactive_tab_foreground #8e8e93
# Not a colour. Carried over so all three theme files share one key set and
# switching cannot leave a stale key behind.
cursor_trail 1
