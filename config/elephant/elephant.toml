# Elephant — backend data provider service for Walker.
#
# DELIBERATELY MINIMAL. Elephant's full option set is not documented in the
# repo README; it is generated from the binary itself. Dump the real schema and
# extend this file from it rather than guessing:
#
#   elephant generate doc                 # all providers
#   elephant generate doc websearch       # one provider
#   elephant generate config              # write default configs, keeping yours
#   elephant listproviders                # what is actually loaded
#
# NOTE: older notes referred to `elephant generatedoc`. That command does not
# exist in 2.22.0 — it is `elephant generate doc` (alias `elephant g d`).
#
# Per-provider settings go in sibling files named after the provider —
# ~/.config/elephant/websearch.toml, files.toml, clipboard.toml, and so on —
# not in this file.
#
# Six of the installed providers (1password, bitwarden, dnfpackages, menus,
# niriactions, nirisessions) do not appear in `listproviders` on this machine:
# they need a backing CLI or a different distro/compositor.

# Text after this character is passed to the launched entry as an argument
# instead of being used to search, so a mismatch between the two sides makes
# "firefox#https://example.com" search for the URL rather than open it.
#
# Walker's side is NOT set in ~/.config/walker/config.toml — it inherits "#"
# from /etc/xdg/walker/config.toml:7. That inheritance is real: walker links the
# Rust `config` crate, which layers config sources rather than replacing them,
# so an unset key falls through to the system file. The two therefore match, but
# only by inheritance — if you ever set this to something else, set it in
# ~/.config/walker/config.toml too rather than relying on the /etc/xdg default.
global_argument_delimiter = "#"
