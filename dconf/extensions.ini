[blur-my-shell]
rounded-blur-found=false
settings-version=2

[blur-my-shell/appfolder]
brightness=0.59999999999999998
sigma=30

[blur-my-shell/dash-to-dock]
blur=true
brightness=0.59999999999999998
sigma=30
static-blur=true
style-dash-to-dock=0

[blur-my-shell/panel]
brightness=0.59999999999999998
corner-radius=0
sigma=30

[blur-my-shell/window-list]
brightness=0.59999999999999998
sigma=30

[dash-to-dock]
apply-custom-theme=true
background-opacity=0.45000000000000001
click-action='focus-minimize-or-previews'
customize-alphas=true
hot-keys=false
max-alpha=0.75
min-alpha=0.40000000000000002
running-indicator-style='DOTS'
transparency-mode='FIXED'

[just-perfection]
activities-button=false
clock-menu-position=1
clock-menu-position-offset=20
window-demands-attention-focus=true

[media-controller]
card-art-size='large'
card-show-player-switcher=true
panel-position='left'
show-next=false
show-play-pause=false
show-player-icon=true
show-previous=false
show-title=true

[search-light]
background-color=(0.12, 0.12, 0.13, 0.84999999999999998)
blur-background=false
border-color=(1.0, 1.0, 1.0, 0.12)
border-radius=3.0
border-thickness=1
entry-font-size=1
monitor-count=1
scale-height=0.0
scale-width=0.0
shortcut-search=['<Super>space']

[user-theme]
name='WhiteSur-Dark'
